name: Build GodsEye IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project GodsEye.xcodeproj \
            -scheme GodsEye \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build | tail -n 60

      - name: Package IPA
        run: |
          rm -rf Payload && mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/GodsEye.app Payload/
          zip -qr GodsEye.ipa Payload
          ls -la GodsEye.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GodsEye-unsigned-ipa
          path: GodsEye.ipa

      - name: Publish "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest GodsEye.ipa \
            -t "GodsEye latest" \
            -n "Unsigned build — sign with your signer and install. Built from ${GITHUB_SHA::7}." \
            --latest
